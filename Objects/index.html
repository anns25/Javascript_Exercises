<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"

    <link rel="stylesheet" href="app.css">
    <title>Movie Catalog</title>
</head>

<body>
    <div class="container py-5">
        <div class="d-flex justify-content-around">

            <!-- FORM  -->
            <div class="card shadow-sm mx-auto">
                <div class="card-header">
                    <h4 class="mb-0">Add New Movie</h4>
                </div>
                <div class="card-body">
                    <form id="movieForm">
                        <div class="mb-3">
                            <label for="addTitle" class="form-label">Movie Title</label>
                            <input type="text" class="form-control" id="addTitle" placeholder="Enter movie title" required>
                        </div>
                        <div class="mb-3">
                            <label for="addGenre" class="form-label">Genre</label>
                            <input type="text" class="form-control" id="addGenre" placeholder="Enter genre" required>
                        </div>
                        <div class="mb-3">
                            <label for="addRating" class="form-label">IMDb Rating</label>
                            <input type="number" class="form-control" id="addRating" placeholder="e.g. 8.5" min="0"
                                max="10" step="0.1" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100" id="add">Add Movie</button>
                    </form>
                </div>
            </div>

            <!-- Update Form (Initially Hidden) -->
            <div id="updateFormContainer" class="card p-3 mt-4 d-none">
                <h5>Update Movie</h5>
                <form id="updateForm">
                    <input type="hidden" id="updateIndex">

                    <div class="mb-2">
                        <label for="updateTitle">Title</label>
                        <input type="text" class="form-control" id="updateTitle" required>
                    </div>

                    <div class="mb-2">
                        <label for="updateGenre">Genre</label>
                        <input type="text" class="form-control" id="updateGenre" required>
                    </div>

                    <div class="mb-2">
                        <label for="updateRating">Rating</label>
                        <input type="text" class="form-control" id="updateRating" required>
                    </div>

                    <button type="submit" class="btn btn-primary" id="save-change">Save Changes</button>
                </form>
            </div>

            <!-- TABLE -->

            <div class="card shadow-lg mx-auto" style="max-width: 700px;">
                <div class="card-body">
                    <h2 class="text-center mb-4">Movie Catalog</h2>
                    <table class="table table-bordered table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Title</th>
                                <th>Genre</th>
                                <th>Imdb Rating</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
