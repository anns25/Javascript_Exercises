<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Number Array Playground</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="app.css" rel="stylesheet">
 
</head>

<body>

  <div class="container text-center">
    <h2 class="mb-4 fw-bold">Number Array</h2>

    <div class="input-group mb-3">
      <input type="text" class="form-control" id="numberInput" placeholder="Enter a number">
      <button class="btn btn-primary" id="add-btn">Add</button>
    </div>

    <p class="fw-semibold">Array: [<span id="arr-elem"></span>]</p>
    <p class="fw-semibold">Sum : <span id="sum_display"></span></p>

    <div class="d-flex justify-content-center btn-group mb-3">
      <button class="btn btn-outline-dark" id="double-btn">Double All Numbers</button>
      <button class="btn btn-outline-dark" id="even-btn">Get Even Numbers</button>
      <button class="btn btn-outline-dark" id="sum-btn">Calculate Sum</button>
      <button class="btn btn-outline-dark" id="pop-btn">Remove Last</button>
      <button class="btn btn-outline-dark" id="shift-btn">Remove First</button>
      <button class="btn btn-outline-dark" id="sort-btn">Sort</button>
      <button class="btn btn-outline-dark" id="rev-btn">Reverse</button>
      <button class="btn btn-danger" id="clear-btn">Clear</button>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>

</html>
